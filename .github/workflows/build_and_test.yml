name: Build and Test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Every other run gets its own
# group, so runs on master are never cancelled or replaced by a newer push:
# release.yml needs the `Release` artifact of the exact commit that was tagged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_module:
    name: Build Module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/powershell/Modules
          key: ${{ runner.os }}-pwsh-PSModules-${{ hashFiles('tools/build.requirements.psd1') }}
      - run: ./tools/setup.ps1
      - run: Invoke-Build -Task ShowDebugInfo
      - run: Invoke-Build -Task Build
      # release.yml downloads this artifact by name. Don't rename it.
      - uses: actions/upload-artifact@v7
        with:
          name: Release
          path: ./release/

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.shell }})
    needs: build_module
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
            modules: ~/Documents/WindowsPowerShell/Modules
          - os: windows-latest
            shell: pwsh
            modules: ~/Documents/PowerShell/Modules
          - os: ubuntu-latest
            shell: pwsh
            modules: ~/.local/share/powershell/Modules
          - os: macos-latest
            shell: pwsh
            modules: ~/.local/share/powershell/Modules
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Release
          path: ./release/
      - uses: actions/cache@v6
        with:
          path: ${{ matrix.modules }}
          key: ${{ runner.os }}-${{ matrix.shell }}-PSModules-${{ hashFiles('tools/build.requirements.psd1') }}
      - run: ./tools/setup.ps1
      - run: Invoke-Build -Task ShowDebugInfo
      - run: Invoke-Build -Task Test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ runner.os }}-${{ matrix.shell }}-Unit-Tests
          path: Test*.xml
