name: Create Release and Publish

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact from commit that got tagged
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: build_and_test.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          name: Release
          path: ./release/
          if_no_artifact_found: fail

      - run: ./tools/setup.ps1
        shell: pwsh

      - run: Invoke-Build -Task ShowDebugInfo -VersionToPublish $env:TAG
        shell: pwsh

      - run: Invoke-Build -Task Publish -VersionToPublish $env:TAG -PSGalleryAPIKey $env:PSGALLERY_API_KEY
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGalleryAPIKey }}

      - name: Attest build provenance of PSIni.zip
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./release/PSIni.zip

      - name: Cherry pick CHANGELOG.md
        id: changelog
        uses: lipkau/gh-tools/actions/changelog-to-release@v1
        with:
          version-name: ${{ github.ref_name }}
          configuration: ./.github/changelog.configuration.json
        if: ${{ hashFiles('CHANGELOG.md') != '' }}

      - name: Create GitHub release with PSIni.zip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.body }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          gh release create "$TAG" ./release/PSIni.zip \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$notes_file"
